# Hand-kept corrections to the generated neighbor graph (ADR 0003). Pairs are keyed by SCB
# kommun codes, quoted so YAML keeps the leading zero; the names are for readers and must match.

# Ferry links, only for kommuner with no land border or fixed link (#6). A kommun linked only by
# ferry is a dead end: a route may start or end there, but never pass through it.
ferries:
  - between: ["0980", "0192"]
    names: [Gotland, Nynäshamn]
    reason: Destination Gotland's year-round car ferry Visby–Nynäshamn.
  - between: ["0980", "0882"]
    names: [Gotland, Oskarshamn]
    reason: Destination Gotland's year-round car ferry Visby–Oskarshamn.
  - between: ["1407", "1480"]
    names: [Öckerö, Göteborg]
    reason: Västtrafik's Öckeröleden car ferry Hönö–Lilla Varholmen (Hisingen).

# Verdicts on the pairs the build flags (short-border, point-touch, non-qualifying-link,
# island-border, exclave-border, river-border); see data/graph-report.md and "Reviewing flagged
# pairs" in data/README.md.
# Every flagged pair needs exactly one, and bun run graph:check fails on stale ones. Run
# bun run graph:review after editing. The build drops an exclave-border pair, and an island-border
# or river-border pair under 1000 m, unless a qualifying fixed link keeps it; a keep leaves that as
# it is, and an add puts it back. An island-border or river-border pair of 1000 m or more is a land
# neighbor, flagged because that border is its only valid link.
#
# overrides change the generated graph, with a reason and an http(s) evidence link:
#   - remove: ["<code>", "<code>"]   # or add: ["<code>", "<code>"] with link: land | fixed
#     names: [<name>, <name>]
#     reason: ...
#     evidence: https://...
overrides: []

# reviewed keeps what the build decided for the listed flags:
#   - keep: ["<code>", "<code>"]
#     names: [<name>, <name>]
#     kinds: [short-border]       # the flags that were reviewed
#     reason: ...
reviewed:
  - keep: ["0305", "0330"]
    names: [Håbo, Knivsta]
    kinds: [non-qualifying-link]
    reason: Linked only by way 956692672, a short unpaved private driveway bridge to an islet under 1 km²; not a public link to meaningful land, so they aren't neighbors.
  - keep: ["0381", "0486"]
    names: [Enköping, Strängnäs]
    kinds: [island-border]
    reason: The OSM boundaries share only 408 m of land border, all on islands in Mälaren and none on the mainland. Riksväg 55 (way 58916726) crosses that border on a Mälaren island of 1 km² or more, which Hjulstabron joins to Enköping's mainland and Strängnäsbron to Strängnäs's; that road link makes them neighbors.
  - keep: ["0486", "1980"]
    names: [Strängnäs, Västerås]
    kinds: [island-border]
    reason: The OSM boundaries share only 328 m of land border, all on islands in Mälaren and none on the mainland, and no fixed link joins them, so they aren't neighbors.
  - keep: ["1440", "1482"]
    names: [Ale, Kungälv]
    kinds: [river-border]
    reason: Their OSM boundaries share no land, only an 18695 m border in Göta älv's river area (relation 56230), so the build makes them land neighbors.
  - keep: ["1462", "1489"]
    names: [Lilla Edet, Alingsås]
    kinds: [exclave-border]
    reason: Their 1003 m land border lies wholly on an exclave of Lilla Edet, away from its main part, and no fixed link joins them, so they aren't neighbors.
  - keep: ["1760", "1862"]
    names: [Storfors, Degerfors]
    kinds: [short-border]
    reason: The OSM boundaries share a 64 m land border on the mainland, so they are land neighbors; a qualifying fixed link, way 1201771779, also crosses it.
  - keep: ["2061", "2081"]
    names: [Smedjebacken, Borlänge]
    kinds: [exclave-border]
    reason: Their 2968 m land border lies wholly on an exclave of Borlänge, away from its main part, and no fixed link joins them, so they aren't neighbors.
  - keep: ["2080", "2083"]
    names: [Falun, Hedemora]
    kinds: [point-touch]
    reason: The OSM boundaries meet at a single point on the mainland, the corner where Falun, Hedemora, Säter and Hofors meet, so they are land neighbors.
  - keep: ["2082", "2104"]
    names: [Säter, Hofors]
    kinds: [point-touch]
    reason: The OSM boundaries meet at a single point on the mainland, the corner where Falun, Hedemora, Säter and Hofors meet, so they are land neighbors.
  - keep: ["2422", "2505"]
    names: [Sorsele, Arvidsjaur]
    kinds: [river-border]
    reason: Their OSM boundaries share no land, only a 7264 m border in the river area of relation 2343268, so the build makes them land neighbors.
