    reason: Linked by Tjörnbron, a public fixed link; there is no land border. SCB's map only joins kommuner that share land.
  - keep: ["1419", "1421"]
    names: [Tjörn, Orust]
    kinds: [scb-mismatch]
    reason: Linked by the road 160 bridge, a public fixed link; there is no land border. SCB's map only joins kommuner that share land.
  - keep: ["1440", "1482"]
    names: [Ale, Kungälv]
