# Hand-kept corrections to the generated neighbor graph (ADR 0003). Pairs are keyed by SCB
# kommun codes, quoted so YAML keeps the leading zero; the names are for readers and must match.

# Ferry links, only for kommuner with no land border or fixed link (#6). A kommun linked only by
# ferry is a dead end: a route may start or end there, but never pass through it.
ferries:
  - between: ["0980", "0192"]
    names: [Gotland, Nynäshamn]
    reason: Destination Gotland's year-round car ferry Visby–Nynäshamn.
  - between: ["0980", "0882"]
    names: [Gotland, Oskarshamn]
    reason: Destination Gotland's year-round car ferry Visby–Oskarshamn.
  - between: ["1407", "1480"]
    names: [Öckerö, Göteborg]
    reason: Västtrafik's Öckeröleden car ferry Hönö–Lilla Varholmen (Hisingen).

# Verdicts on the pairs the build flags (scb-mismatch, short-border, point-touch,
# non-qualifying-link, island-border, exclave-border); see data/graph-report.md and "Reviewing flagged pairs" in data/README.md.
# Every flagged pair needs exactly one, and bun run graph:check fails on stale ones. Run
# bun run graph:review after editing. The build drops an island-border or exclave-border pair
# unless a qualifying fixed link keeps it; a keep leaves that as it is, and an add puts it back.
#
# overrides change the generated graph, with a reason and an http(s) evidence link:
#   - remove: ["<code>", "<code>"]   # or add: ["<code>", "<code>"] with link: land | fixed
#     names: [<name>, <name>]
#     reason: ...
#     evidence: https://...
overrides:
  - add: ["0331", "2084"]
    names: [Heby, Avesta]
    link: land
    reason: The OSM boundaries meet at a corner on land; a corner touch counts as a land border.
    evidence: https://www.openstreetmap.org/?mlat=60.19509&mlon=16.70479#map=17/60.19509/16.70479
  - add: ["1981", "2181"]
    names: [Sala, Sandviken]
    link: land
    reason: The OSM boundaries meet at a corner on land; a corner touch counts as a land border.
    evidence: https://www.openstreetmap.org/?mlat=60.19509&mlon=16.70479#map=17/60.19509/16.70479
  - add: ["2080", "2083"]
    names: [Falun, Hedemora]
    link: land
    reason: The OSM boundaries meet at a corner on land; a corner touch counts as a land border.
    evidence: https://www.openstreetmap.org/?mlat=60.61031&mlon=16.13649#map=17/60.61031/16.13649
  - add: ["2082", "2104"]
    names: [Säter, Hofors]
    link: land
    reason: The OSM boundaries meet at a corner on land; a corner touch counts as a land border.
    evidence: https://www.openstreetmap.org/?mlat=60.61031&mlon=16.13649#map=17/60.61031/16.13649

# reviewed keeps what the build decided for the listed flags:
#   - keep: ["<code>", "<code>"]
#     names: [<name>, <name>]
#     kinds: [short-border]       # the flags that were reviewed
#     reason: ...
reviewed:
  - keep: ["0125", "0180"]
    names: [Ekerö, Stockholm]
    kinds: [scb-mismatch]
    reason: Linked by Nockebybron, a public fixed link; the only land they share is on islands under 1 km². SCB's map only joins kommuner that share land.
  - keep: ["0180", "0186"]
    names: [Stockholm, Lidingö]
    kinds: [scb-mismatch]
    reason: Linked by Lidingöbron, Lilla Lidingöbron and Lidingöbanan, a public fixed link; there is no land border. SCB's map only joins kommuner that share land.
  - keep: ["0305", "0330"]
    names: [Håbo, Knivsta]
    kinds: [non-qualifying-link]
    reason: Linked only by way 956692672, a short unpaved private driveway bridge to an islet under 1 km²; not a public link to meaningful land, so they aren't neighbors. SCB's map joins them through the water.
  - keep: ["0381", "0486"]
    names: [Enköping, Strängnäs]
    kinds: [island-border]
    reason: The OSM boundaries share only 408 m of land border, all on islands in Mälaren and none on the mainland, and no fixed link joins them, so they aren't neighbors. SCB's map doesn't join them either.
  - keep: ["0484", "1980"]
    names: [Eskilstuna, Västerås]
    kinds: [scb-mismatch]
    reason: The OSM boundaries share a 1336 m land border that SCB's generalised map misses. Kvicksundsbron (road and rail) also links them.
  - keep: ["0486", "1980"]
    names: [Strängnäs, Västerås]
    kinds: [island-border]
    reason: The OSM boundaries share only 328 m of land border, all on islands in Mälaren and none on the mainland, and no fixed link joins them, so they aren't neighbors. SCB's map doesn't join them either.
  - keep: ["0840", "0880"]
    names: [Mörbylånga, Kalmar]
    kinds: [scb-mismatch]
    reason: Linked by Ölandsbron, a public fixed link; there is no land border. SCB's map only joins kommuner that share land.
  - keep: ["1415", "1419"]
    names: [Stenungsund, Tjörn]
    kinds: [scb-mismatch]
    reason: Linked by Tjörnbron, a public fixed link; there is no land border. SCB's map only joins kommuner that share land.
  - keep: ["1419", "1421"]
    names: [Tjörn, Orust]
    kinds: [scb-mismatch]
    reason: Linked by the road 160 bridge, a public fixed link; there is no land border. SCB's map only joins kommuner that share land.
  - keep: ["1462", "1489"]
    names: [Lilla Edet, Alingsås]
    kinds: [exclave-border]
    reason: Their 1003 m land border lies wholly on an exclave of Lilla Edet, away from its main part, and no fixed link joins them, so they aren't neighbors. SCB's map doesn't join them either.
  - keep: ["1760", "1862"]
    names: [Storfors, Degerfors]
    kinds: [scb-mismatch, short-border]
    reason: The OSM boundaries share a 64 m land border that SCB's generalised map misses.
  - keep: ["2061", "2081"]
    names: [Smedjebacken, Borlänge]
    kinds: [exclave-border]
    reason: Their 2968 m land border lies wholly on an exclave of Borlänge, away from its main part, and no fixed link joins them, so they aren't neighbors. SCB's map doesn't join them either.
  - keep: ["2132", "2161"]
    names: [Nordanstig, Ljusdal]
    kinds: [scb-mismatch]
    reason: The OSM boundaries share a 9623 m land border that SCB's generalised map misses.
