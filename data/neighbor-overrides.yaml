# Hand-kept corrections to the generated neighbor graph (ADR 0003). Pairs are keyed by SCB
# kommun codes, quoted so YAML keeps the leading zero; the names are for readers and must match.

# Ferry links, only for kommuner with no land border or fixed link (#6). A kommun linked only by
# ferry is a dead end: a route may start or end there, but never pass through it.
ferries:
  - between: ["0980", "0192"]
    names: [Gotland, Nynäshamn]
    reason: Destination Gotland's year-round car ferry Visby–Nynäshamn.
  - between: ["0980", "0882"]
    names: [Gotland, Oskarshamn]
    reason: Destination Gotland's year-round car ferry Visby–Oskarshamn.
  - between: ["1407", "1480"]
    names: [Öckerö, Göteborg]
    reason: Västtrafik's Öckeröleden car ferry Hönö–Lilla Varholmen (Hisingen).

# Verdicts on the pairs the build flags (scb-mismatch, short-border, point-touch,
# non-qualifying-link, island-border, exclave-border, river-border); see data/graph-report.md and "Reviewing flagged pairs" in data/README.md.
# Every flagged pair needs exactly one, and bun run graph:check fails on stale ones. Run
# bun run graph:review after editing. The build drops an exclave-border pair, and an island-border
# or river-border pair under 1000 m, unless a qualifying fixed link keeps it; a keep leaves that as
# it is, and an add puts it back. An island-border or river-border pair of 1000 m or more is a land
# neighbor, flagged because that border is its only valid link.
#
# overrides change the generated graph, with a reason and an http(s) evidence link:
#   - remove: ["<code>", "<code>"]   # or add: ["<code>", "<code>"] with link: land | fixed
#     names: [<name>, <name>]
#     reason: ...
#     evidence: https://...
overrides: []

# reviewed keeps what the build decided for the listed flags:
#   - keep: ["<code>", "<code>"]
#     names: [<name>, <name>]
#     kinds: [short-border]       # the flags that were reviewed
#     reason: ...
reviewed:
  - keep: ["0120", "0182"]
    names: [Värmdö, Nacka]
    kinds: [island-border]
    reason: The OSM boundaries share 6710 m of land border, all on Värmdölandet, an island of 1 km² or more where Nacka's Boo meets Värmdö, and none on the mainland; that island border makes them land neighbors. SCB's map joins them too.
  - keep: ["0125", "0180"]
    names: [Ekerö, Stockholm]
    kinds: [scb-mismatch]
    reason: Linked by Nockebybron, a public fixed link; the only land they share is on islands under 1 km². SCB's map only joins kommuner that share land.
  - keep: ["0180", "0186"]
    names: [Stockholm, Lidingö]
    kinds: [scb-mismatch]
    reason: Linked by Lidingöbron, Lilla Lidingöbron and Lidingöbanan, a public fixed link; there is no land border. SCB's map only joins kommuner that share land.
  - keep: ["0305", "0330"]
    names: [Håbo, Knivsta]
    kinds: [non-qualifying-link]
    reason: Linked only by way 956692672, a short unpaved private driveway bridge to an islet under 1 km²; not a public link to meaningful land, so they aren't neighbors. SCB's map joins them through the water.
  - keep: ["0381", "0486"]
    names: [Enköping, Strängnäs]
    kinds: [island-border]
    reason: The OSM boundaries share only 408 m of land border, all on islands in Mälaren and none on the mainland, and no fixed link joins them, so they aren't neighbors. SCB's map doesn't join them either.
  - keep: ["0484", "1980"]
    names: [Eskilstuna, Västerås]
    kinds: [scb-mismatch, island-border]
    reason: The OSM boundaries share a 1336 m land border, all on islands of 1 km² or more in Mälaren at Kvicksund and none on the mainland, that SCB's generalised map misses. Kvicksundsbron (road and rail) also links them, though the detected link doesn't qualify since way 196169497 has an end off meaningful land.
  - keep: ["0486", "1980"]
    names: [Strängnäs, Västerås]
    kinds: [island-border]
    reason: The OSM boundaries share only 328 m of land border, all on islands in Mälaren and none on the mainland, and no fixed link joins them, so they aren't neighbors. SCB's map doesn't join them either.
  - keep: ["0840", "0880"]
    names: [Mörbylånga, Kalmar]
    kinds: [scb-mismatch]
    reason: Linked by Ölandsbron, a public fixed link; there is no land border. SCB's map only joins kommuner that share land.
  - keep: ["0840", "0885"]
    names: [Mörbylånga, Borgholm]
    kinds: [island-border]
    reason: The OSM boundaries share 25453 m of land border, all across Öland, and none on the mainland; Öland's border makes them land neighbors. SCB's map joins them too.
  - keep: ["1415", "1419"]
    names: [Stenungsund, Tjörn]
