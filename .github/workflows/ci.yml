name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's older runs. Pushes to main each get their own group, so
# no main run (and no production deploy) is ever cancelled; deploy-production queues them.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  checks:
    name: Required checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The schedule and frozen graph versions checks compare with the base revision.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # The Cloudflare Vite plugin and cf load cloudflare.config.ts with Node, not Bun.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bunx oxfmt --check

      - name: Lint
        run: bunx oxlint --deny-warnings

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Schedule rules check
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run schedule:check --base "$BASE_REVISION"

      - name: Runway check
        run: bun run runway:check

      - name: Frozen graph versions check
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run graph-versions:check --base "$BASE_REVISION"

      - name: Build
        run: bunx vite build

      - name: Static headers check
        run: bun run headers:check

      - name: Neighbor graph check
        run: bun run graph:check

      - name: Validate the Worker build
        run: bunx cf deploy --prebuilt --mode production --dry-run

      - name: Upload the production build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloudflare-output
          path: .cloudflare/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    name: Deploy production
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      # The same URL as SITE_URL in src/siteUrl.ts.
      url: https://akle.grehn.net
    # Production deploys run one at a time, in order, and are never cancelled.
    concurrency:
      group: production
      cancel-in-progress: false
      queue: max
    steps:
      # Checks for an older commit can finish after a newer one has deployed; never roll back.
      - name: Skip unless this commit is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tip="$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main has moved on to $tip; its run deploys instead of $GITHUB_SHA."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.tip.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        if: steps.tip.outputs.deploy == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node
        if: steps.tip.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        if: steps.tip.outputs.deploy == 'true'
        run: bun install --frozen-lockfile

      - name: Download the checked build
        if: steps.tip.outputs.deploy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloudflare-output
          path: .cloudflare/output/

      - name: Deploy
        if: steps.tip.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="${COMMIT_MESSAGE%%$'\n'*}"
          bunx cf deploy --prebuilt --mode production --message "${subject:0:100}" --tag "${GITHUB_SHA:0:12}"

  # Previews need the Cloudflare token, so they run only for PRs from this repository. PRs from
  # forks (and Dependabot, which gets no environment secrets) run the checks only.
  deploy-preview:
    name: Deploy preview
    needs: checks
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    # Shares the group with Preview cleanup, which cancels this job. This job only queues, so it
    # can never cancel the cleanup; a new push cancels this PR's older CI runs anyway.
    concurrency:
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The PR may have closed (and its preview been deleted) while the checks ran.
      - name: Skip unless the PR is still open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "state=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq .state)" >> "$GITHUB_OUTPUT"

      - name: Deploy preview
        id: preview
        if: steps.open.outputs.state == 'open'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          result="$(bunx cf previews deploy "$PREVIEW_NAME")"
          printf '%s\n' "$result"
          echo "url=$(printf '%s' "$result" | jq -er '.preview_urls[0]')" >> "$GITHUB_OUTPUT"
