name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Required checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The schedule and frozen graph versions checks compare with the base revision.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bunx oxfmt --check

      - name: Lint
        run: bunx oxlint --deny-warnings

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Schedule rules check
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run schedule:check --base "$BASE_REVISION"

      - name: Frozen graph versions check
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run graph-versions:check --base "$BASE_REVISION"

      - name: Build
        run: bunx vite build

      - name: Neighbor graph check
        run: bun run graph:check
