name: Schedule extension

# Quarterly (1 January, April, July and October), and by hand: opens or updates the extension PR when the schedule runs low (ADR 0001).
# The decisions live in scripts/extend-schedule.ts.
on:
  schedule:
    - cron: "17 6 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only print what would be done
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time, so two runs never race on the extension branch.
concurrency:
  group: schedule-extension
  cancel-in-progress: false

jobs:
  extend:
    name: Extend the schedule
    runs-on: ubuntu-latest
    steps:
      # PRs opened or pushed with GITHUB_TOKEN don't trigger the checks; the GitHub App's do.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SCHEDULE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCHEDULE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # The App token isn't stored in .git/config; only the steps that push or call gh get it.
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Commit as the GitHub App
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      # gh's git credential helper reads GH_TOKEN when git pushes, so the token stays in this step.
      - name: Extend the schedule
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: |
          gh auth setup-git
          bun run schedule:extend ${DRY_RUN:+"$DRY_RUN"}
