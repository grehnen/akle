name: Preview cleanup

# Runs on pull_request (never pull_request_target), so PRs from forks get no secrets.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  delete-preview:
    name: Delete preview
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    # Shares the group with CI's deploy-preview job, so a preview deploy still running is
    # cancelled instead of recreating the preview after it is deleted. deploy-preview never
    # cancels and queues instead, so it can't cancel this job either.
    concurrency:
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A PR can close before its preview ever deployed: a missing preview is already cleaned up.
      # Any other failure still fails the job.
      - name: Delete preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          if output="$(bunx cf previews delete "$PREVIEW_NAME" --worker akle --force 2>&1)"; then
            printf '%s\n' "$output"
          elif printf '%s' "$output" | grep -qiE '\b404\b|not found'; then
            printf '%s\n' "$output"
            echo "::notice::Preview $PREVIEW_NAME doesn't exist; nothing to delete."
          else
            printf '%s\n' "$output" >&2
            exit 1
          fi
